[env:esp32-s3-relay-6ch]
platform = espressif32 @ ^6.10.0
board = esp32-s3-devkitc-1
framework = arduino

;============================
; CPU //ESP32-S3-WROOM-1U M0N16
;============================
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

;============================
; Flash & Partition
;============================
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

;============================
; USB CDC & System Build Flags
;============================
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0 ; 0:None, 1:Error, 2:Warn, 3:Info, 4:Debug, 5:Verbose
    ; ซ่อน Warning ยิบย่อยจากไลบรารีภายนอกใน Core 3.x
    -w

;============================
; Upload & Monitor
;============================
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
build_type = debug

;============================
; Libraries
;============================
lib_deps =
    https://github.com/dawidchyrzynski/arduino-home-assistant.git
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.1
    densaugeo/base64@^1.2
    knolleary/PubSubClient@^2.8
    esp32async/ESPAsyncWebServer@^3.7.0
    esp32async/AsyncTCP@^3.3.7